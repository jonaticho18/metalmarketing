<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Metal Marketing - Tracking Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand">
      <span>METAL MARKETING</span>
      <span class="nav-badge">Tracking Lab</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Cursos</a>
      <a href="carrito.html" class="cart-icon">
        🛒 <span class="cart-count" style="display:none">0</span>
      </a>
    </div>
  </nav>

  <div class="page-hero">
    <h1>TU CARRITO</h1>
    <p>Revisa tus cursos seleccionados antes de continuar al checkout.</p>
  </div>

  <div class="container">
    <div id="cart-content">
      <!-- Rendered by JS -->
    </div>
  </div>

  <script src="tracking-lab.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-content');

      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:60px 24px;">
            <span style="font-size:64px;">🛒</span>
            <h2 style="margin-top:16px;">Tu carrito está vacío</h2>
            <p style="color:var(--text-secondary);margin-top:8px;">Explorá nuestros cursos y encontrá el que necesitas.</p>
            <a href="index.html" class="btn btn-primary" style="margin-top:24px;">Ver cursos</a>
          </div>
        `;
        return;
      }

      const total = getCartTotal();
      
      container.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:start;">
          <div id="cart-items">
            ${cart.map(item => `
              <div class="cart-item" id="cart-item-${item.item_id}">
                <div class="cart-item-img">${item.emoji}</div>
                <div class="cart-item-info">
                  <h3>${item.item_name}</h3>
                  <span style="color:var(--text-muted);font-size:12px;">${item.item_category2} · ${item.level}</span>
                  <div class="cart-item-price" style="margin-top:4px;">
                    <span style="font-size:12px;color:var(--text-muted);font-family:var(--font-body);">ARS</span>
                    $${formatPrice(item.price)}
                  </div>
                </div>
                <button class="cart-remove" onclick="handleRemove('${item.item_id}')">✕ Quitar</button>
              </div>
            `).join('')}
          </div>
          <div class="cart-summary">
            <h3>RESUMEN</h3>
            <div class="summary-row">
              <span>Subtotal (${cart.length} curso${cart.length > 1 ? 's' : ''})</span>
              <span>$${formatPrice(total)}</span>
            </div>
            <div class="summary-row">
              <span>Envío</span>
              <span style="color:var(--success);">Digital - Gratis</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span class="amount">$${formatPrice(total)}</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;" onclick="handleCheckout()">
              Continuar al checkout →
            </a>
            <a href="index.html" style="display:block;text-align:center;margin-top:12px;color:var(--text-secondary);font-size:13px;text-decoration:none;">
              ← Seguir comprando
            </a>
          </div>
        </div>
      `;
    }

    function handleRemove(productId) {
      const el = document.getElementById(`cart-item-${productId}`);
      if (el) {
        el.style.opacity = '0';
        el.style.transform = 'translateX(-20px)';
        el.style.transition = 'all 0.3s ease';
      }
      setTimeout(() => {
        removeFromCart(productId);
        renderCart();
        showNotification('Producto eliminado del carrito');
      }, 300);
    }

    function handleCheckout() {
      // ==========================================
      // DATA LAYER: begin_checkout
      // Este evento se dispara cuando el usuario
      // hace click en "Continuar al checkout".
      // Es una señal de MUY alta intención de compra.
      // ==========================================
      trackBeginCheckout();
    }

    // Initial render
    renderCart();

    // ==========================================
    // DATA LAYER: view_cart
    // Se dispara al cargar la página del carrito.
    // Sirve para medir cuántos usuarios llegan
    // al carrito vs cuántos pasan a checkout.
    // ==========================================
    trackViewCart();
  </script>
</body>
</html>
