  <div class="page-hero">
    <h1>CURSOS DE MARKETING DIGITAL</h1>
    <p>Aprende las habilidades que el mercado demanda. Cursos prácticos, sin relleno, con resultados medibles.</p>
  </div>

  <div class="container">
    <div class="product-grid" id="product-grid">
      <!-- Products rendered by JS -->
    </div>
  </div>

  <script src="tracking-lab.js"></script>
  <script>
    // ==========================================
    // RENDER PRODUCT CARDS
    // ==========================================
    const grid = document.getElementById('product-grid');
    
    PRODUCTS.forEach((product, index) => {
      const card = document.createElement('a');
      card.href = `producto.html?id=${product.item_id}`;
      card.className = 'product-card';
      card.innerHTML = `
        <div class="product-img">
          ${product.emoji}
          <span class="level-badge">${product.level}</span>
        </div>
        <div class="product-info">
          <h3>${product.item_name}</h3>
          <p class="desc">${product.description}</p>
          <div class="product-meta">
            <span class="product-price">
              <span class="currency">ARS</span> $${formatPrice(product.price)}
            </span>
          </div>
        </div>
      `;
      
      // Track click on product (select_item)
      card.addEventListener('click', () => {
        pushToDataLayer({
          event: "select_item",
          ecommerce: {
            item_list_id: "cursos_marketing",
            item_list_name: "Cursos de Marketing Digital",
            items: [formatItem(product, index)]
          }
        });
      });
      
      grid.appendChild(card);
    });

    // ==========================================
    // DATA LAYER: view_item_list
    // Este evento se dispara cuando la página
    // de catálogo se carga. Le dice a GA4 que
    // el usuario vio esta lista de productos.
    // ==========================================
    trackViewItemList(PRODUCTS, "Cursos de Marketing Digital");
  </script>
